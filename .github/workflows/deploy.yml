name: Deploy to production

# Continuous deployment only (no tests here): every push to main builds the service images, pushes them to GHCR and
# deploys them to the EC2 server. The server's deploy script waits for every container to be healthy and rolls back to
# the previous version when the new one does not start.
#
# Roll back by hand: Actions > Deploy to production > Run workflow, give an older image tag (like sha-1a2b3c4).
# Setup of the server and of the secrets used below: deploy/README.md

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "environment-service/example/**"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Deploy this existing image tag without building (rollback). Empty = build the current commit"
        required: false
        default: ""

# One   deployment at a time, a running one is never cancelled halfway
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      registry: ${{ steps.vars.outputs.registry }}
      build: ${{ steps.vars.outputs.build }}
    steps:
      - id: vars
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "registry=ghcr.io/${owner}/backend" >> "$GITHUB_OUTPUT"
          if [ -n "${INPUT_TAG}" ]; then
            echo "tag=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # java = runtime JRE, jdk = compiler. The Java 17 modules (Spring Boot 3.1, old Lombok) must be compiled by JDK 17
          - { module: discovery-service, java: "17", jdk: "17", ffmpeg: "false" }
          - { module: config-service, java: "17", jdk: "17", ffmpeg: "false" }
          - { module: storage-service, java: "17", jdk: "17", ffmpeg: "true" }
          - { module: identity-service, java: "21", jdk: "21", ffmpeg: "false" }
          - { module: profile-service, java: "21", jdk: "21", ffmpeg: "false" }
          - { module: chat-service, java: "21", jdk: "21", ffmpeg: "false" }
          - { module: notification-service, java: "21", jdk: "21", ffmpeg: "false" }
          - { module: api-gateway, java: "21", jdk: "21", ffmpeg: "false" }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.module }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          build-args: |
            MODULE=${{ matrix.module }}
            BUILD_JDK=${{ matrix.jdk }}
            JAVA_VERSION=${{ matrix.java }}
            INSTALL_FFMPEG=${{ matrix.ffmpeg }}
          tags: |
            ${{ needs.prepare.outputs.registry }}/${{ matrix.module }}:${{ needs.prepare.outputs.tag }}
            ${{ needs.prepare.outputs.registry }}/${{ matrix.module }}:latest
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  deploy:
    needs: [prepare, build]
    # Run when the images were built, or when an existing tag is redeployed (build skipped). Never after a failed build
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # Protected environment: add "Required reviewers" in the repository settings to approve each production deployment
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Keep idle connections alive. The first deployment dropped with "Broken pipe" while the server was busy
          printf 'Host *\n  ServerAliveInterval 20\n  ServerAliveCountMax 15\n  ConnectTimeout 30\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # First connection is trusted. Put the server's host key in the EC2_KNOWN_HOSTS secret to pin it
            ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          fi

      - name: Copy deployment files
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
        run: |
          SSH="ssh -i ~/.ssh/id_deploy"
          $SSH "$USER_NAME@$HOST" 'mkdir -p /opt/zapoo/config'
          rsync -e "$SSH" -az deploy/docker-compose.prod.yml deploy/deploy.sh "$USER_NAME@$HOST:/opt/zapoo/"
          # The production config files are served by config-service, keep the server in sync with the repository
          rsync -e "$SSH" -az --delete environment-service/prod/ "$USER_NAME@$HOST:/opt/zapoo/config/"

      - name: Write .env on the server
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
          ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_FILE" | ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" 'umask 077 && cat > /opt/zapoo/.env'

      - name: Deploy ${{ needs.prepare.outputs.tag }}
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER_NAME: ${{ secrets.EC2_USER }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          SSH="ssh -i $HOME/.ssh/id_deploy"

          # The token only lives for this job. It is sent over the SSH connection, never written into a file
          printf '%s' "$GHCR_TOKEN" | $SSH "$USER_NAME@$HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          # Start the deployment DETACHED on the server: pulling images and waiting for every container to be healthy
          # takes many minutes, and a dropped SSH connection must not kill it halfway. The script reports its progress
          # in /opt/zapoo/.deploy_status (running | success | failed) and /opt/zapoo/deploy.log
          $SSH "$USER_NAME@$HOST" "cd /opt/zapoo && chmod +x deploy.sh && rm -f .deploy_status && : > deploy.log \
            && REGISTRY='$REGISTRY' setsid nohup ./deploy.sh '$TAG' > deploy.log 2>&1 < /dev/null & sleep 1; echo started"

          # Follow it with short SSH calls (a failed poll is simply retried)
          SEEN=0
          for attempt in $(seq 1 180); do   # 180 x 15 s = 45 minutes at most
            if OUT=$($SSH "$USER_NAME@$HOST" "(cat /opt/zapoo/.deploy_status 2>/dev/null || echo starting); echo @@LOG@@; tail -n +$((SEEN + 1)) /opt/zapoo/deploy.log 2>/dev/null"); then
              STATUS=$(printf '%s\n' "$OUT" | sed -n '1p')
              LOG=$(printf '%s\n' "$OUT" | sed '1,/^@@LOG@@$/d')
              if [ -n "$LOG" ]; then
                printf '%s\n' "$LOG"
                SEEN=$((SEEN + $(printf '%s\n' "$LOG" | wc -l)))
              fi
              case "$STATUS" in
                success) echo "::notice::Deployment of $TAG succeeded"; exit 0 ;;
                failed)  echo "::error::Deployment of $TAG FAILED (see the log above, the server rolled back if it could)"; exit 1 ;;
              esac
            else
              echo "(could not reach the server, retrying)"
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for the deployment to finish"
          exit 1
