server:
  port: ${CHAT_SERVICE_PORT:8085}
  servlet:
    context-path: /chat

spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: ${CHAT_MONGODB_URI:mongodb://root:root@localhost:27017/chat-service?authSource=admin}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:changeme}

app:
  services:
    profile:
      url: ${PROFILE_SERVICE_BASE_URL:http://localhost:8081/profile}
    identity:
      url: ${IDENTITY_SERVICE_BASE_URL:http://localhost:8080/identity}
