server:
  port: ${FILE_SERVICE_PORT:8084}
  servlet:
    context-path: /file

spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: ${FILE_MONGODB_URI:mongodb://root:root@localhost:27017/file-service?authSource=admin}
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

app:
  file:
    storage-dir: ${FILE_STORAGE_DIR:./uploads}
    download-prefix: ${FILE_DOWNLOAD_PREFIX:http://localhost:8888/api/v1/file/media/download/}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
