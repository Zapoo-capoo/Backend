name: zapooo
version: "3.9"
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    hostname: kafka
    restart: always
    ports:
      - "9094:9094"
    environment:
      # KRaft mode (no Zookeeper)
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      # Controller quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      # Listeners
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      # Map protocol
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Controller listener
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Required for single node
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Dev config
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # Dev config cho Single Node (Sửa lỗi Coordinator Not Available)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-1
    restart: always
    ports:
      - "9090:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG: "true"

  mongo:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongo_data:/data/db
  neo4j:
    image: neo4j:5-community-ubi10
    container_name: neo4j
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass 123456
    volumes:
      - redis_data:/data
  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    restart: always
    ports:
      - "5540:5540"   # RedisInsight UI
    environment:
      RI_APP_PORT: 5540
      RI_APP_HOST: 0.0.0.0
      RI_REDIS_HOST0: redis
      RI_REDIS_PORT0: 6379
      RI_REDIS_USERNAME0: default
      RI_REDIS_PASSWORD0: 123456
    depends_on:
      - redis
  # Search engine of the posts (post-service). Standalone mode, one core called "posts"; its fields are created by
  # post-service the first time it indexes or searches (SolrPostSearch). Admin UI: http://localhost:8983
  solr:
    image: solr:9.8
    container_name: solr
    restart: always
    ports:
      - "8983:8983"
    command: solr-precreate posts
    environment:
      SOLR_HEAP: 512m
    volumes:
      - solr_data:/var/solr
  # Turns text into vectors for the semantic search of the posts. HuggingFace Text Embeddings Inference serving a
  # multilingual mod el (it understands Vietnamese), 384 dimensions. The first start downloads the model (~470MB)
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    container_name: embedding
    restart: always
    ports:
      - "8089:80"
    command: --model-id intfloat/multilingual-e5-small
    volumes:
      - embedding_data:/data
volumes:
  solr_data:
  embedding_data:
  mongo_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  kafka_data:
