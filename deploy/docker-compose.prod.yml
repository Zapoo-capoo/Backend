# Production stack for one EC2 machine: the Java services plus the infrastructure they need.
#
#   cd /opt/zapoo && docker compose --env-file .env -f docker-compose.prod.yml up -d
#
# Only two ports are published to the outside: the API gateway (8888) and the chat Socket.IO server (8099).
# Everything else is reachable only from inside this compose network.
#
# post-service and notification-service are not deployed yet (add them here later, the gateway already has routes).
name: zapoo

x-java-service: &java-service
  restart: unless-stopped
  env_file: .env
  environment: &java-env
    SPRING_CLOUD_CONFIG_URI: http://config-service:7720
    EUREKA_SERVER_URL: http://discovery-service:8761/eureka/
    JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "3"

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storage}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-identity}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # Small buffer pool and no performance schema keep MySQL around 300 MB instead of its large defaults
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--innodb-buffer-pool-size=128M", "--performance-schema=OFF"]
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo_data:/data/db
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    logging: *logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 64m
    volumes:
      - neo4j_data:/data
    mem_limit: 768m
    healthcheck:
      # The container only knows NEO4J_AUTH (neo4j/<password>), take the password from it
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    logging: *logging

  kafka:
    image: apache/kafka:3.7.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 30s
    logging: *logging

  # Search engine of the posts. Standalone, one core "posts"; post-service creates its fields on first use
  solr:
    image: solr:9.8
    restart: unless-stopped
    command: solr-precreate posts
    environment:
      SOLR_HEAP: 384m
    volumes:
      - solr_data:/var/solr
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8983'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging

  # Turns text into vectors for the semantic search of the posts (HuggingFace Text Embeddings Inference, CPU).
  # The first start downloads the model (~470MB) into the volume, the later ones reuse it
  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    restart: unless-stopped
    # The model warms up with a batch of --max-batch-tokens tokens, the default (16384) needs more memory than this
    # container may have: it was killed there, again and again. Posts are short, a small batch is plenty
    command: --model-id intfloat/multilingual-e5-small --max-batch-tokens 2048
    volumes:
      - embedding_data:/data
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
    logging: *logging

  # ------------------------------------------------------------------ platform services
  discovery-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/discovery-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: discovery-service, BUILD_JDK: "17", JAVA_VERSION: "17" }
    environment:
      <<: *java-env
      # Do not depend on the module's application.yml being inside the image
      SERVER_PORT: "8761"
      SPRING_APPLICATION_NAME: discovery-service
      EUREKA_CLIENT_REGISTERWITHEUREKA: "false"
      EUREKA_CLIENT_FETCHREGISTRY: "false"
    depends_on:
      # Order only (discovery does not use the config server): config first, then discovery
      config-service: { condition: service_healthy }
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  config-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/config-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: config-service, BUILD_JDK: "17", JAVA_VERSION: "17" }
    environment:
      <<: *java-env
      # Do not depend on the module's application.yml being inside the image (it was missing: port 8080 was used)
      SERVER_PORT: "7720"
      SPRING_APPLICATION_NAME: config-service
      # Serve the production config files (environment-service/prod, copied to ./config on the server)
      SPRING_PROFILES_ACTIVE: native
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCHLOCATIONS: file:/config/
      # Its application.yml logs every web request at DEBUG, far too chatty for production
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: INFO
    volumes:
      - ./config:/config:ro
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7720'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ------------------------------------------------------------------ business services
  profile-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/profile-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: profile-service, JAVA_VERSION: "21" }
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 640m
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8081'" ]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s
  identity-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/identity-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: identity-service, JAVA_VERSION: "21" }
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      # identity creates the "admin" user and its profile only once, on its very first start. profile-service has to
      # be up by then, otherwise the admin account stays without a profile for good
      profile-service: { condition: service_healthy }
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s



  chat-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/chat-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: chat-service, JAVA_VERSION: "21" }
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      # Not needed to start (chat only calls them while serving requests), but starting after them keeps the
      # startup order config > discovery > profile > identity > chat and spreads the CPU/RAM peak of JVM startups
      identity-service: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      # Socket.IO (realtime messages). Clients connect straight to it, not through the gateway
      - "8099:8099"
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8085'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  storage-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/storage-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: storage-service, BUILD_JDK: "17", JAVA_VERSION: "17", INSTALL_FFMPEG: "true" }
    depends_on:
      config-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
    volumes:
      # Scratch space of uploads and local fallback copies of media
      - storage_data:/app/data
    # Uploads are processed with ffmpeg (thumbnails, transcoding), which needs room besides the JVM heap
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7881'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  notification-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/notification-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: notification-service, JAVA_VERSION: "21" }
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 450m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  post-service:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/post-service:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: post-service, JAVA_VERSION: "21" }
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      kafka: { condition: service_healthy }
      mongo: { condition: service_healthy }
      solr: { condition: service_healthy }
      embedding: { condition: service_healthy }
    mem_limit: 450m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  api-gateway:
    <<: *java-service
    image: ${REGISTRY:-ghcr.io/zapoo-capoo/backend}/api-gateway:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { MODULE: api-gateway, JAVA_VERSION: "21" }
    depends_on:
      config-service: { condition: service_healthy }
      discovery-service: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      profile-service: { condition: service_healthy }
      chat-service: { condition: service_healthy }
      storage-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
      post-service: { condition: service_healthy }
    ports:
      - "8888:8888"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8888'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  redis_data:
  neo4j_data:
  kafka_data:
  solr_data:
  embedding_data:
  storage_data:
