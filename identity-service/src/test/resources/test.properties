# In-memory H2 (MySQL mode). NON_KEYWORDS=USER lets the `user` table name work.
spring.datasource.url = jdbc:h2:mem:testdb;MODE=MYSQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username = sa
spring.datasource.password = sa
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto = create-drop

# Keep the test context self-contained (no external infra)
spring.cloud.config.enabled = false
spring.cloud.config.fail-fast = false
eureka.client.enabled = false
spring.kafka.listener.auto-startup = false

# Properties the context beans need (normally served by config-service)
jwt.signerKey = dEA8oD/lGNSB/mPyTVZJ+pd7I7SeJgCzBbyvQwguf2s=
jwt.valid-duration = 3600
jwt.refreshable-duration = 360000
app.services.profile.url = http://localhost:8081/profile
google.client.id = test-client-id
google.client.secret = test-client-secret
google.redirectUri = http://localhost:3000/authenticate
