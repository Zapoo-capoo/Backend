server:
  port: 8085
  servlet:
    context-path: /chat
spring:
  application:
    name: chat-service
  data:
    mongodb:
      uri: mongodb://CHANGE_ME:CHANGE_ME@localhost:27017/chat-service?authSource=admin
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379
      username: default
      password: CHANGE_ME

app:
  services:
    profile:
      url: http://localhost:8081/profile
    identity:
      url: http://localhost:8080/identity
