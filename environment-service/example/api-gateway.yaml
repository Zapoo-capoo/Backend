server:
  port: 8888
  servlet:
    context-path: /api-gateway
app:
  api-prefix: /api/v1
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity_service
          uri: lb://identity-service
          predicates:
          - Path=${app.api-prefix}/identity/**
          filters:
          - StripPrefix=2
        - id: profile_service
          uri: http://localhost:8081
          predicates:
          - Path=${app.api-prefix}/profile/**
          filters:
          - StripPrefix=2
        - id: notification_service
          uri: http://localhost:8082
          predicates:
            - Path=${app.api-prefix}/notification/**
          filters:
            - StripPrefix=2
        - id: post
          uri: http://localhost:8083
          predicates:
            - Path=${app.api-prefix}/post/**
          filters:
            - StripPrefix=2
        - id: file_service
          uri: lb://file-service
          predicates:
            - Path=${app.api-prefix}/file/**
          filters:
            - StripPrefix=2
        - id: chat_service
          uri: http://localhost:8085
          predicates:
            - Path=${app.api-prefix}/chat/**
          filters:
            - StripPrefix=2
        - id: storage_service
          uri: http://localhost:7881
          predicates:
            - Path=${app.api-prefix}/storage-service/**
          filters:
            - StripPrefix=2
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: identity-service
        url: ${app.api-prefix}/identity/v3/api-docs
      - name: profile-service
        url: ${app.api-prefix}/profile/v3/api-docs
      - name: chat-service
        url: ${app.api-prefix}/chat/v3/api-docs
      - name: storage-service
        url: ${app.api-prefix}/storage-service/v3/api-docs
      - name: notification-service
        url: ${app.api-prefix}/notification/v3/api-docs
      - name: post-service
        url: ${app.api-prefix}/post/v3/api-docs
