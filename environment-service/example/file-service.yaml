server:
  port: 8084
  servlet:
    context-path: /file
spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: mongodb://CHANGE_ME:CHANGE_ME@localhost:27017/file-service?authSource=admin
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
app:
  file:
    storage-dir: D:/Project/Zapoo/file
    download-prefix: http://localhost:8888/api/v1/file/media/download/
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
