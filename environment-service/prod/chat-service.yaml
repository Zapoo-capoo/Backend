# Production config of chat-service, served by config-service from /config (see deploy/docker-compose.prod.yml).
# No secrets here: every ${NAME} is read from the environment (deploy/.env on the server).
# Socket.IO listens on 8099 inside the chat-service process (fixed in code), compose publishes it.
server:
  port: 8085
  servlet:
    context-path: /chat

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

spring:
  application:
    name: chat-service
  data:
    mongodb:
      # MONGO_USER / MONGO_PASSWORD must not contain characters that need URL-encoding (@ : / ? # %)
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:mongo}:27017/chat-service?authSource=admin
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      username: default
      password: ${REDIS_PASSWORD}

app:
  services:
    profile:
      url: http://profile-service:8081/profile
    identity:
      url: http://identity-service:8080/identity
    storage:
      url: http://storage-service:7881/storage-service
  storage:
    # Public links to uploaded files, as seen by browsers (through the gateway)
    public-url: ${PUBLIC_BASE_URL}/api/v1/storage-service/files
