# Production config of notification-service, served by config-service from /config (see deploy/docker-compose.prod.yml).
# No secrets here: every ${NAME} is read from the environment (deploy/.env on the server).
server:
  port: 8082
  servlet:
    context-path: /notification

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://discovery-service:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

brevo:
  api-key: ${BREVO_API_KEY}

spring:
  application:
    name: notification-service
  data:
    mongodb:
      # MONGO_USER / MONGO_PASSWORD must not contain characters that need URL-encoding (@ : / ? # %)
      uri: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_HOST:mongo}:27017/notification-service?authSource=admin
      # Creates the indexes declared on Notification (unique dedup key, 90 days TTL)
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      username: default
      password: ${REDIS_PASSWORD}
      timeout: 60000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

app:
  kafka:
    topics:
      notification-events: notification.events
  services:
    identity: http://identity-service:8080/identity
    profile: http://profile-service:8081/profile
